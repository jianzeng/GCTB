[build-system]
requires = ["setuptools>=40.8.0", "wheel", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gctb"
version = "1.1.0"
description = "Genome-wide Complex Trait Bayesian Analysis with Python Interface"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Jian Zeng"},
    {name = "Luke Lloyd-Jones"},
    {name = "Zhili Zheng"},
    {name = "Shouye Liu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "click>=8.0.0",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.4.0", "seaborn>=0.11.0"]
dev = ["pytest>=6.0", "pytest-cov", "black", "flake8"]

[project.scripts]
gctb = "gctb.cli:main"

[project.urls]
Homepage = "http://cnsgenomics.com/software/gctb"

